                        <a
                            href="mailto:rene.renner@lmeworldwide.com"
                            class="footerLinks-link"

                    </li>
                    <li class="footerLinks-entry">
                        Website By
                        <a
                            href="https://noordermeer.ch"
                            rel="noopener"
                            class="footerLinks-link"

                        <a
                            href="https://rubenfeurer.com"
                            class="footerLinks-link"
                            rel="noopener"
                        >Ruben Feurer (Design)</a>
                    </li>
